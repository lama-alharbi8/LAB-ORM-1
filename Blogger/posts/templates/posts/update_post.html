{% extends 'main/base.html' %}

{% block title %}Update Post - Blogger{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="text-center mb-4">Update {{post.title}}</h1>
        
        <div class="card">
            <div class="card-body">
                <form method="post" action="{% url 'posts:post_update_view' post.id %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Enter post title" required value="{{post.title}}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Content</label>
                        <textarea name="content" class="form-control" rows="8" placeholder="Write your post here..." required >{{post.content}}</textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Publish</label>
                            <select name="is_published" class="form-select" value="{{post.is_published}}">
                                <option value=True {%if is_published%}selected{%endif%}>Publish Now</option>
                                <option value=False {%if not is_published%}selected{%endif%}>Save as Draft</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Publish Date</label>
                            <input type="datetime-local" name="published_at" class="form-control" value="{{post.published_at|date:'Y-m-d\TH:i'}}" >
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-3">
                            <img src="{{post.image.url}}" class="w-100"/>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Post Image</label>
                        <input type="file" name="image">
                        <div class="form-text">Optoinal: Add an image to your post</div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-paper-plane me-2"></i>Update Post
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-body">
                <h5><i class="fas fa-lightbulb text-warning me-2"></i>Tips</h5>
                <ul class="mb-0">
                    <li>Write a good title</li>
                    <li>Use paragraphs</li>
                    <li>Check your spelling</li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}

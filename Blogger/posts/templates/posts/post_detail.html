{% extends 'main/base.html' %}

{% block title %}Post Details - Blogger{% endblock %}

{% block content %}

<h1 class="display-4 fw-bold text-primary mb-4">{{post.title}}</h1>

<div class="row justify-content-center">
    <div class="col-lg-10">
        {% if post.image %}
        <div class="mb-4 text-center">
            <img src="{{post.image.url}}" class="rounded shadow w-100" style="max-height: 500px; object-fit: cover;"
                alt="{{post.title}}" />
        </div>
        {% endif %}

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="{% url 'posts:post_update_view' post.id %}" class="btn btn-outline-primary">
                <i class="fas fa-edit me-2"></i>Update
            </a>
            <a href="{% url 'posts:post_delete_view' post.id %}" class="btn btn-outline-danger"
                onclick="return confirm('Are you sure you want to delete this post?')">
                <i class="fas fa-trash me-2"></i>Delete
            </a>
        </div>

        <div class="bg-light rounded p-4 shadow-sm">
            <p class="fs-5 lh-lg text-dark mb-4">{{post.content}}</p>

            <div class="text-end">
                <small class="text-muted">
                    <i class="fas fa-clock me-1"></i>
                    Published on {{post.published_at}}
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}

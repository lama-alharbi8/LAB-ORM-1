{% load static %}
<!DOCTYPE html>
<html lang="en" {% if 'mode' in request.COOKIES %}class="dark-mode" {% endif %}>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}Blogger{% endblock %}</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">
                    <i class="fas fa-blog me-2"></i>Blogger
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/">Home</a>
                        <a class="nav-link" href="{% url 'posts:create_post_view' %}">Create Post</a>
                        <a class="nav-link" href="{% url 'posts:all_posts_view' %}">All Posts</a>
                        <a class="nav-link" href="#">About</a>
                        <a class="nav-link" href="#">Contact</a>

                        <form role="search" method="get" action="{%url 'posts:search_post_view'%}">
                            <input class="form-control" type="search" placeholder="Search" aria-label="Search" name="search" value="{{request.GET.search}}">
                        </form>

                        <div class="theme ms-2">
                            <a href="{% url 'main:mode_view' 'light' %}?page={{ request.path }}"
                                class="btn btn-outline-light {% if not 'mode' in request.COOKIES %}active{% endif %}">
                                <i class="fas fa-sun"></i>
                            </a>
                            <a href="{% url 'main:mode_view' 'dark' %}?page={{ request.path }}"
                                class="btn btn-outline-light {% if 'mode' in request.COOKIES %}active{% endif %}">
                                <i class="fas fa-moon"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2025 Blogger. Made with Django & Bootstrap</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
